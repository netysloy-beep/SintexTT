server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # Hashed Vite build assets never change: cache aggressively.
  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
  }

  # Always revalidate index.html so app updates apply immediately.
  location = /index.html {
    add_header Cache-Control "no-cache";
  }
  location / {
    add_header Cache-Control "no-cache";
    try_files $uri $uri/ /index.html;
  }

  # API proxy: public backend URL, resolved at request time (no startup DNS failure).
  location /api/ {
    resolver 1.1.1.1 8.8.8.8 valid=60s ipv6=off;
    set $backend_origin $BACKEND_ORIGIN;
    rewrite ^/api/(.*)$ /$1 break;
    proxy_pass $backend_origin;
    proxy_ssl_server_name on;
    proxy_ssl_name $proxy_host;
    proxy_connect_timeout 75s;
    proxy_read_timeout 75s;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }
}
