# Render Blueprint — fully free-tier setup (no payment info required).
# Postgres -> Neon (neon.tech), Redis -> Upstash (upstash.com): paste connection strings.
# Backend runs API + workers + bot in one process (dist/all.js) on the free plan.
services:
  - type: web
    name: sintex-backend
    runtime: docker
    dockerfilePath: packages/backend/Dockerfile
    plan: free
    healthCheckPath: /health
    dockerCommand: sh -c "npx prisma migrate deploy && npx prisma db seed && node dist/all.js"
    envVars:
      - key: DATABASE_URL
        sync: false   # paste Neon connection string here
      - key: REDIS_URL
        sync: false   # paste Upstash Redis connection string here
      - key: NODE_ENV
        value: production
      - key: SESSION_TTL_HOURS
        value: "168"
      - key: BOT_TOKEN
        sync: false
      - key: BOT_WEBAPP_URL
        sync: false
      - key: CORS_ORIGINS
        sync: false

  - type: web
    name: sintex-frontend
    runtime: docker
    dockerfilePath: packages/frontend/Dockerfile
    plan: free
    envVars:
      - key: BACKEND_HOST
        fromService:
          name: sintex-backend
          type: web
          property: host
      - key: BACKEND_PORT
        fromService:
          name: sintex-backend
          type: web
          property: port
