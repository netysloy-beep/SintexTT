# Render Blueprint — fully free-tier setup (no payment info required).
# Redis runs inside the backend container (free plan has a single instance, no extra resources).
# Postgres is external: paste a Supabase Session pooler URI into DATABASE_URL.
# Backend runs API + workers + bot in one process (dist/all.js).
services:
  - type: web
    name: sintex-backend
    runtime: docker
    dockerfilePath: packages/backend/Dockerfile
    plan: free
    healthCheckPath: /health
    dockerCommand: ./scripts/render-start.sh
    envVars:
      - key: DATABASE_URL
        sync: false   # paste Supabase Session pooler URI here (aws-...pooler.supabase.com)
      - key: REDIS_URL
        value: redis://127.0.0.1:6379
      - key: NODE_ENV
        value: production
      - key: SESSION_TTL_HOURS
        value: "168"
      - key: BOT_TOKEN
        sync: false
      - key: BOT_WEBAPP_URL
        sync: false
      - key: CORS_ORIGINS
        sync: false

  - type: web
    name: sintex-frontend
    runtime: docker
    dockerfilePath: packages/frontend/Dockerfile
    plan: free
    envVars:
      - key: BACKEND_ORIGIN
        value: https://sintex-backend-rl3r.onrender.com
