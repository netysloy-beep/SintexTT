# Render Blueprint — https://render.com/docs/blueprint-spec
# One Starter web service runs API + workers + bot (dist/all.js), keeping cost at ~$7/mo total.
services:
  # Redis-compatible Key Value instance (BullMQ, rate limits, idempotency)
  - type: keyvalue
    name: sintex-redis
    plan: free
    maxmemoryPolicy: noeviction

  - type: web
    name: sintex-backend
    dockerfilePath: packages/backend/Dockerfile
    plan: starter
    healthCheckPath: /health
    dockerCommand: sh -c "npx prisma migrate deploy && npx prisma db seed && node dist/all.js"
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: sintex-pg
          property: connectionString
      - key: REDIS_HOST
        fromService:
          type: keyvalue
          name: sintex-redis
          property: host
      - key: REDIS_PORT
        fromService:
          type: keyvalue
          name: sintex-redis
          property: port
      - key: NODE_ENV
        value: production
      - key: SESSION_TTL_HOURS
        value: "168"
      - key: BOT_TOKEN
        sync: false
      - key: BOT_WEBAPP_URL
        sync: false
      - key: CORS_ORIGINS
        sync: false

  - type: web
    name: sintex-frontend
    dockerfilePath: packages/frontend/Dockerfile
    plan: free
    envVars:
      - key: BACKEND_HOST
        fromService:
          name: sintex-backend
          type: web
          property: host
      - key: BACKEND_PORT
        fromService:
          name: sintex-backend
          type: web
          property: port

databases:
  - name: sintex-pg
    plan: free
    databaseName: econ
    user: econ
